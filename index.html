<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200與1000以內的數：位值與積木互動教具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Block Dragging styling */
        .block-item {
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            touch-action: none;
        }
        .block-item:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 50;
        }

        /* Pulse animation for regroup button */
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .pulse-animation {
            animation: pulse-btn 1.5s infinite ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- Top Header Bar -->
    <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0 shadow-sm gap-2">
        <div class="flex items-center space-x-2 shrink-0">
            <div class="bg-indigo-600 text-white p-2 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-cubes text-2xl"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">數的位值教具</h1>
        </div>

        <!-- Question Mode Buttons & Target Submission Controls -->
        <div class="flex items-center space-x-2 shrink-0">
            <button onclick="generateRandomQuestion()" class="bg-indigo-50 border-2 border-indigo-200 hover:bg-indigo-100 text-indigo-700 text-sm font-bold py-1.5 px-3 rounded-xl transition flex items-center shadow-sm">
                <i class="fa-solid fa-dice text-lg mr-1.5 text-indigo-500"></i>隨機出題
            </button>
            <button onclick="promptCustomQuestion()" class="bg-emerald-50 border-2 border-emerald-200 hover:bg-emerald-100 text-emerald-700 text-sm font-bold py-1.5 px-3 rounded-xl transition flex items-center shadow-sm">
                <i class="fa-solid fa-pen-to-square text-lg mr-1.5 text-emerald-500"></i>自訂出題
            </button>
        </div>

        <!-- Target Challenge Banner -->
        <div id="target-display-container" class="hidden sm:flex items-center bg-amber-50 border-2 border-amber-300 rounded-xl px-3 py-1 shadow-inner shrink-0 gap-2">
            <span class="text-amber-800 font-bold text-sm flex items-center">
                <i class="fa-solid fa-bullseye text-amber-600 mr-1 text-base"></i>目標：
            </span>
            <span id="target-number-text" class="text-2xl font-black text-amber-900 tracking-wider">---</span>
            
            <button id="submit-answer-btn" onclick="checkSubmittedAnswer()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition flex items-center">
                <i class="fa-solid fa-circle-check text-sm mr-1"></i>確認繳交
            </button>
            <span id="target-status-badge" class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-200 text-amber-800">作答中</span>
        </div>

        <!-- Short Guidance Bar -->
        <div class="flex items-center space-x-2 shrink-0">
            <div id="self-explanation-box" class="bg-indigo-50 border border-indigo-200 text-indigo-900 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center max-w-xs md:max-w-md">
                <i class="fa-solid fa-lightbulb text-amber-500 text-lg mr-2 shrink-0"></i>
                <span id="guidance-text">點擊或拖曳積木操作！</span>
            </div>
        </div>
    </header>

    <!-- Main Content Container: Left 22%, Middle 56%, Right 22% -->
    <main class="flex-1 flex overflow-hidden p-2 gap-2">

        <!-- ================= LEFT PANEL (積木盒 選單) ================= -->
        <section class="w-[22%] bg-white rounded-2xl border border-slate-200 shadow-sm p-3 flex flex-col justify-between shrink-0 overflow-y-auto">
            <div>
                <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-200">
                    <h2 class="font-black text-slate-700 text-base flex items-center">
                        <i class="fa-solid fa-toolbox text-indigo-500 mr-2 text-lg"></i>積木盒
                    </h2>
                </div>

                <!-- Block Cards List with minimal concise text -->
                <div class="space-y-3">
                    
                    <!-- 100 Block (Blue) -->
                    <div class="bg-blue-50 border-2 border-blue-400 rounded-xl p-3 flex flex-col items-center cursor-grab active:cursor-grabbing hover:shadow-md transition active:scale-95 group"
                         draggable="true"
                         ondragstart="handleMenuDragStart(event, 'hundreds')"
                         onclick="addBlock('hundreds')"
                         title="點擊新增 百">
                        <div class="flex justify-between w-full mb-1 pointer-events-none items-center">
                            <span class="font-black text-blue-800 text-sm">百 (100)</span>
                            <span class="text-xs font-black bg-blue-600 text-white px-2 py-0.5 rounded-full">+100</span>
                        </div>
                        <div class="w-16 h-16 relative my-1 pointer-events-none border border-blue-600 bg-blue-500 rounded flex items-center justify-center shadow-sm">
                            <svg viewBox="0 0 100 100" class="w-full h-full opacity-40">
                                <path d="M 10 0 L 10 100 M 20 0 L 20 100 M 30 0 L 30 100 M 40 0 L 40 100 M 50 0 L 50 100 M 60 0 L 60 100 M 70 0 L 70 100 M 80 0 L 80 100 M 90 0 L 90 100" stroke="#ffffff" stroke-width="1.5"/>
                                <path d="M 0 10 L 100 10 M 0 20 L 100 20 M 0 30 L 100 30 M 0 40 L 100 40 M 0 50 L 100 50 M 0 60 L 100 60 M 0 70 L 100 70 M 0 80 L 100 80 M 0 90 L 90 90" stroke="#ffffff" stroke-width="1.5"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 10 Block (Yellow) -->
                    <div class="bg-amber-50 border-2 border-amber-400 rounded-xl p-3 flex flex-col items-center cursor-grab active:cursor-grabbing hover:shadow-md transition active:scale-95 group"
                         draggable="true"
                         ondragstart="handleMenuDragStart(event, 'tens')"
                         onclick="addBlock('tens')"
                         title="點擊新增 十">
                        <div class="flex justify-between w-full mb-1 pointer-events-none items-center">
                            <span class="font-black text-amber-800 text-sm">十 (10)</span>
                            <span class="text-xs font-black bg-amber-500 text-white px-2 py-0.5 rounded-full">+10</span>
                        </div>
                        <div class="w-4 h-12 relative my-1 pointer-events-none border border-amber-600 bg-amber-400 rounded flex items-center justify-center shadow-sm">
                            <svg viewBox="0 0 10 100" class="w-full h-full opacity-40">
                                <path d="M 0 10 L 10 10 M 0 20 L 10 20 M 0 30 L 10 30 M 0 40 L 10 40 M 0 50 L 10 50 M 0 60 L 10 60 M 0 70 L 10 70 M 0 80 L 10 80 M 0 90 L 10 90" stroke="#000000" stroke-width="1.5"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 1 Block (White) -->
                    <div class="bg-slate-50 border-2 border-slate-300 rounded-xl p-3 flex flex-col items-center cursor-grab active:cursor-grabbing hover:shadow-md transition active:scale-95 group"
                         draggable="true"
                         ondragstart="handleMenuDragStart(event, 'ones')"
                         onclick="addBlock('ones')"
                         title="點擊新增 一">
                        <div class="flex justify-between w-full mb-1 pointer-events-none items-center">
                            <span class="font-black text-slate-700 text-sm">一 (1)</span>
                            <span class="text-xs font-black bg-slate-600 text-white px-2 py-0.5 rounded-full">+1</span>
                        </div>
                        <div class="w-4 h-4 relative my-2 pointer-events-none border border-slate-400 bg-white rounded-sm shadow-sm"></div>
                    </div>

                </div>
            </div>

            <!-- Icon Hint -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-2 text-center text-xs font-bold text-slate-500 mt-2 flex items-center justify-center gap-1">
                <i class="fa-solid fa-hand-pointer text-indigo-500"></i>
                <span>點擊或拖曳積木</span>
            </div>
        </section>


        <!-- ================= MIDDLE PANEL (操作區 85% + 分解區 15%) ================= -->
        <section class="w-[56%] flex flex-col gap-2 shrink-0">

            <!-- TOP PANEL (85% Height): Expanded Workspace -->
            <div class="h-[85%] bg-slate-800 rounded-2xl border-2 border-slate-700 shadow-lg flex flex-col overflow-hidden relative">
                
                <!-- Canvas Bar Header -->
                <div class="bg-slate-900/90 border-b border-slate-700 px-3 py-1.5 flex items-center justify-between z-10 shrink-0 text-white">
                    <span class="text-sm font-bold flex items-center">
                        <i class="fa-solid fa-layer-group text-indigo-400 mr-1.5"></i>積木操作區
                    </span>
                    <span id="total-blocks-count-badge" class="text-xs bg-slate-700 text-slate-200 px-2.5 py-0.5 rounded-full font-bold">
                        共 0 個積木
                    </span>
                </div>

                <!-- Structured Workspace (Horizontal 3-Column Layout) -->
                <div id="workspace" 
                     ondragover="allowDrop(event)" 
                     ondrop="handleWorkspaceDrop(event)"
                     class="flex-1 p-2.5 overflow-hidden grid grid-cols-3 gap-2 relative select-none">

                    <!-- 1. HUNDREDS COLUMN -->
                    <div class="bg-slate-900/50 border border-blue-500/30 rounded-xl p-2 flex flex-col h-full relative overflow-y-auto">
                        <div class="text-xs font-black text-blue-400 mb-1.5 flex items-center shrink-0 border-b border-blue-500/20 pb-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block mr-1.5"></span>百位 (100)
                        </div>
                        <div id="row-hundreds" class="flex flex-wrap gap-1.5 items-start flex-1 content-start"></div>
                    </div>

                    <!-- 2. TENS COLUMN -->
                    <div class="bg-slate-900/50 border border-amber-500/30 rounded-xl p-2 flex flex-col h-full relative overflow-y-auto">
                        <div class="text-xs font-black text-amber-400 mb-1.5 flex items-center shrink-0 border-b border-amber-500/20 pb-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block mr-1.5"></span>十位 (10)
                        </div>
                        <div id="row-tens" class="flex flex-wrap gap-1.5 items-start flex-1 content-start"></div>
                    </div>

                    <!-- 3. ONES COLUMN -->
                    <div class="bg-slate-900/50 border border-slate-400/30 rounded-xl p-2 flex flex-col h-full relative overflow-y-auto">
                        <div class="text-xs font-black text-slate-300 mb-1.5 flex items-center shrink-0 border-b border-slate-400/20 pb-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-white inline-block mr-1.5"></span>個位 (1)
                        </div>
                        <div id="row-ones" class="flex flex-wrap gap-1.5 items-start flex-1 content-start"></div>
                    </div>

                    <!-- Static Empty State Overlay -->
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 pointer-events-none z-20">
                        <i class="fa-solid fa-hand-holding-hand text-4xl mb-2 text-slate-500"></i>
                        <p class="text-sm font-bold">請點擊或拖曳左側積木</p>
                    </div>

                </div>
            </div>

            <!-- BOTTOM PANEL (15% Height): Compact Decomposition Zone -->
            <div id="conversion-zone" 
                 class="h-[15%] bg-amber-50 rounded-2xl border-2 border-dashed border-amber-300 shadow-inner flex items-center justify-between px-3 py-1.5 relative overflow-hidden transition-colors shrink-0"
                 ondragover="allowDrop(event)" 
                 ondrop="handleDropToConvert(event)">

                <div class="flex items-center shrink-0">
                    <span class="font-black text-amber-900 text-xs flex items-center">
                        <i class="fa-solid fa-arrows-split-up-and-left text-amber-600 mr-1.5"></i>積木分解區
                    </span>
                </div>

                <div class="flex-1 flex items-center justify-center">
                    <div class="border border-amber-200 bg-white/90 rounded-lg px-3 py-1 flex items-center space-x-2 shadow-sm">
                        <i class="fa-solid fa-down-long text-amber-500 animate-bounce text-xs"></i>
                        <span class="text-xs font-bold text-amber-900">將「百」或「十」拖至此處即可分解</span>
                    </div>
                </div>
            </div>

        </section>


        <!-- ================= RIGHT PANEL (22% Width): Place Value Board ================= -->
        <section class="w-[22%] bg-white rounded-2xl border border-slate-200 shadow-sm p-3 flex flex-col justify-between shrink-0 overflow-y-auto">
            <div class="space-y-3">
                
                <!-- Section 1: Place Value Table -->
                <div>
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-200">
                        <h2 class="font-black text-slate-700 text-base flex items-center">
                            <i class="fa-solid fa-table-cells text-indigo-500 mr-1.5 text-lg"></i>位值表
                        </h2>
                    </div>

                    <!-- Dynamic Value Table -->
                    <div class="border-2 border-slate-300 rounded-2xl overflow-hidden shadow-sm bg-white">
                        
                        <!-- Header Row -->
                        <div class="grid grid-cols-3 text-center font-black text-sm border-b border-slate-200 bg-slate-50">
                            <div class="py-1.5 bg-blue-100 text-blue-900 border-r border-slate-200">百位</div>
                            <div class="py-1.5 bg-amber-100 text-amber-900 border-r border-slate-200">十位</div>
                            <div class="py-1.5 bg-slate-200 text-slate-900">個位</div>
                        </div>

                        <!-- Main Row: Digits -->
                        <div class="grid grid-cols-3 text-center font-black text-3xl py-2 bg-white border-b border-slate-200">
                            <div id="pv-digit-hundreds" class="text-blue-600 border-r border-slate-100">0</div>
                            <div id="pv-digit-tens" class="text-amber-500 border-r border-slate-100">0</div>
                            <div id="pv-digit-ones" class="text-slate-700">0</div>
                        </div>

                        <!-- Raw Count Breakdown -->
                        <div class="bg-slate-50 p-2 text-center border-t border-slate-200">
                            <div class="text-xs text-slate-500 font-black mb-1">【實際積木個數】</div>
                            <div class="grid grid-cols-3 gap-1 text-xs font-bold">
                                <div class="bg-blue-50 text-blue-800 py-1 rounded border border-blue-200 flex flex-col items-center">
                                    <span class="text-[10px] font-bold">百</span>
                                    <span id="raw-count-hundreds" class="text-base font-black">0個</span>
                                </div>
                                <div class="bg-amber-50 text-amber-800 py-1 rounded border border-amber-200 flex flex-col items-center">
                                    <span class="text-[10px] font-bold">十</span>
                                    <span id="raw-count-tens" class="text-base font-black">0個</span>
                                </div>
                                <div class="bg-slate-100 text-slate-800 py-1 rounded border border-slate-300 flex flex-col items-center">
                                    <span class="text-[10px] font-bold">一</span>
                                    <span id="raw-count-ones" class="text-base font-black">0個</span>
                                </div>
                            </div>
                        </div>

                        <!-- Total Number Banner -->
                        <div class="bg-indigo-600 text-white p-2 text-center flex items-center justify-between px-3">
                            <span class="text-xs font-bold text-indigo-100">合起來：</span>
                            <span id="pv-total-value" class="text-3xl font-black tracking-wider text-amber-300">0</span>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Reflection Prompt Box -->
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-2.5">
                    <div class="flex items-center text-amber-900 font-black text-xs mb-1">
                        <i class="fa-solid fa-comments text-amber-600 mr-1.5"></i>提示：
                    </div>
                    <p id="reflection-prompt-text" class="text-xs text-amber-900 leading-relaxed font-bold">
                        看一看位值表，現在是多少呢？
                    </p>
                </div>

            </div>

            <!-- Section 3: Undo & Reset Controls -->
            <div class="pt-2 border-t border-slate-200 grid grid-cols-2 gap-2 mt-2">
                <button onclick="undoState()" id="undo-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-black text-xs py-2 px-2 rounded-xl transition flex items-center justify-center disabled:opacity-40 min-h-[40px]">
                    <i class="fa-solid fa-rotate-left mr-1 text-sm"></i>上一步
                </button>
                <button onclick="resetCanvas()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-black text-xs py-2 px-2 rounded-xl transition flex items-center justify-center min-h-[40px]">
                    <i class="fa-solid fa-trash-arrow-up mr-1 text-sm"></i>清空
                </button>
            </div>
        </section>

    </main>

    <!-- Custom Modal for Setting Target Number -->
    <div id="custom-num-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-black text-slate-800 text-base flex items-center">
                    <i class="fa-solid fa-pen-ruler text-indigo-600 mr-2"></i>輸入目標數字
                </h3>
                <button onclick="closeCustomModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">目標數值（1 - 1000）：</label>
                <input type="number" id="custom-num-input" min="1" max="1000" value="142" 
                       class="w-full border-2 border-indigo-200 rounded-xl px-3 py-2 text-2xl font-black text-indigo-900 focus:outline-none focus:border-indigo-500 text-center">
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="closeCustomModal()" class="w-1/2 bg-slate-100 text-slate-700 font-bold text-xs py-2 rounded-xl hover:bg-slate-200 transition min-h-[40px]">
                    取消
                </button>
                <button onclick="applyCustomQuestion()" class="w-1/2 bg-indigo-600 text-white font-bold text-xs py-2 rounded-xl hover:bg-indigo-700 transition min-h-[40px]">
                    確認設定
                </button>
            </div>
        </div>
    </div>


    <!-- Application Logic & Interactive State Management -->
    <script>
        let state = {
            hundreds: 0,
            tens: 0,
            ones: 0,
            targetNumber: null
        };

        let historyStack = [];

        const reflectionPrompts = [
            "數數看，現在畫面上總共有多少？",
            "觀察看看：1個「百」可以換成幾個「十」？",
            "看一看位值表：百位、十位、個位各是多少？",
            "當積木滿10個被圈起來時，點擊按鈕可以合成喔！"
        ];

        function saveSnapshot() {
            if (historyStack.length >= 20) {
                historyStack.shift();
            }
            historyStack.push({
                hundreds: state.hundreds,
                tens: state.tens,
                ones: state.ones
            });
            updateUndoButtonState();
        }

        function addBlock(type) {
            saveSnapshot();
            if (type === 'hundreds') state.hundreds += 1;
            if (type === 'tens') state.tens += 1;
            if (type === 'ones') state.ones += 1;

            updateUI();
            setGuidance(`增加了 1 個${getUnitName(type)}！`);
        }

        function removeBlock(type) {
            if (state[type] > 0) {
                saveSnapshot();
                state[type] -= 1;
                updateUI();
                setGuidance(`拿掉了 1 個${getUnitName(type)}。`);
            }
        }

        function regroup(fromType) {
            saveSnapshot();
            if (fromType === 'ones' && state.ones >= 10) {
                state.ones -= 10;
                state.tens += 1;
                setGuidance("太棒了！10個「一」合成了 1個「十」！");
            } else if (fromType === 'tens' && state.tens >= 10) {
                state.tens -= 10;
                state.hundreds += 1;
                setGuidance("好厲害！10個「十」合成了 1個「百」！");
            }
            updateUI();
        }

        function convertTopBlock(type) {
            if (type === 'hundreds' && state.hundreds > 0) {
                saveSnapshot();
                state.hundreds -= 1;
                state.tens += 10;
                setGuidance("成功把 1個「百」分解成 10個「十」！");
                updateUI();
            } else if (type === 'tens' && state.tens > 0) {
                saveSnapshot();
                state.tens -= 1;
                state.ones += 10;
                setGuidance("成功把 1個「十」分解成 10個「一」！");
                updateUI();
            } else {
                setGuidance(`沒有【${getUnitName(type)}】可以分解喔！`);
            }
        }

        function getCombinedTotal() {
            return (state.hundreds * 100) + (state.tens * 10) + (state.ones * 1);
        }

        function updateUI() {
            const rowHundreds = document.getElementById('row-hundreds');
            const rowTens = document.getElementById('row-tens');
            const rowOnes = document.getElementById('row-ones');
            const emptyState = document.getElementById('empty-state');

            if (!rowHundreds || !rowTens || !rowOnes) return;

            rowHundreds.innerHTML = '';
            rowTens.innerHTML = '';
            rowOnes.innerHTML = '';

            const totalBlockItems = state.hundreds + state.tens + state.ones;

            if (totalBlockItems === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                // 1. HUNDREDS COLUMN
                renderBlockGrid(rowHundreds, state.hundreds, 'hundreds', 0);

                // 2. TENS COLUMN (Regroup Mask if >=10)
                if (state.tens >= 10) {
                    const maskBox = document.createElement('div');
                    maskBox.className = 'w-full border-2 border-dashed border-amber-400 bg-amber-400/20 rounded-xl p-2 flex flex-col items-center gap-1.5 shadow-lg relative shrink-0';
                    
                    const itemsContainer = document.createElement('div');
                    itemsContainer.className = 'flex flex-wrap gap-1 items-center justify-center';
                    for (let i = 0; i < 10; i++) {
                        itemsContainer.appendChild(createBlockDOM('tens'));
                    }
                    maskBox.appendChild(itemsContainer);

                    const regroupBtn = document.createElement('button');
                    regroupBtn.onclick = () => regroup('tens');
                    regroupBtn.className = 'mt-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-black text-xs px-2 py-1 rounded-full shadow-md flex items-center justify-center pulse-animation border border-amber-300 cursor-pointer w-full';
                    regroupBtn.innerHTML = '<i class="fa-solid fa-arrows-to-circle text-amber-900 mr-1"></i><span>滿10合成「百」 ➔</span>';
                    maskBox.appendChild(regroupBtn);

                    rowTens.appendChild(maskBox);
                    renderBlockGrid(rowTens, state.tens, 'tens', 10);
                } else {
                    renderBlockGrid(rowTens, state.tens, 'tens', 0);
                }

                // 3. ONES COLUMN (Regroup Mask if >=10)
                if (state.ones >= 10) {
                    const maskBox = document.createElement('div');
                    maskBox.className = 'w-full border-2 border-dashed border-slate-200 bg-white/20 rounded-xl p-2 flex flex-col items-center gap-1.5 shadow-lg relative shrink-0';

                    const itemsContainer = document.createElement('div');
                    itemsContainer.className = 'flex flex-wrap gap-1 items-center justify-center';
                    for (let i = 0; i < 10; i++) {
                        itemsContainer.appendChild(createBlockDOM('ones'));
                    }
                    maskBox.appendChild(itemsContainer);

                    const regroupBtn = document.createElement('button');
                    regroupBtn.onclick = () => regroup('ones');
                    regroupBtn.className = 'mt-1 bg-slate-100 hover:bg-white text-slate-900 font-black text-xs px-2 py-1 rounded-full shadow-md flex items-center justify-center pulse-animation border border-slate-300 cursor-pointer w-full';
                    regroupBtn.innerHTML = '<i class="fa-solid fa-arrows-to-circle text-indigo-600 mr-1"></i><span>滿10合成「十」 ➔</span>';
                    maskBox.appendChild(regroupBtn);

                    rowOnes.appendChild(maskBox);
                    renderBlockGrid(rowOnes, state.ones, 'ones', 10);
                } else {
                    renderBlockGrid(rowOnes, state.ones, 'ones', 0);
                }
            }

            document.getElementById('total-blocks-count-badge').textContent = `共 ${totalBlockItems} 個`;

            document.getElementById('raw-count-hundreds').textContent = `${state.hundreds}個`;
            document.getElementById('raw-count-tens').textContent = `${state.tens}個`;
            document.getElementById('raw-count-ones').textContent = `${state.ones}個`;

            const totalVal = getCombinedTotal();
            document.getElementById('pv-digit-hundreds').textContent = Math.floor(totalVal / 100);
            document.getElementById('pv-digit-tens').textContent = Math.floor((totalVal % 100) / 10);
            document.getElementById('pv-digit-ones').textContent = totalVal % 10;
            document.getElementById('pv-total-value').textContent = totalVal;

            updateReflectionPrompt();
        }

        function renderBlockGrid(container, totalCount, type, startIndex = 0) {
            const countToRender = totalCount - startIndex;
            if (countToRender <= 0) return;

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'flex flex-wrap gap-1.5 items-start w-full';

            for (let i = 0; i < countToRender; i++) {
                gridWrapper.appendChild(createBlockDOM(type));
            }
            container.appendChild(gridWrapper);
        }

        function createBlockDOM(type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'block-item relative group flex items-center justify-center rounded transition shrink-0 cursor-pointer hover:opacity-80 active:scale-95';
            wrapper.setAttribute('draggable', 'true');
            wrapper.setAttribute('data-type', type);
            wrapper.title = `點擊直接拿掉 1 個${getUnitName(type)}`;

            wrapper.onclick = (e) => {
                e.stopPropagation();
                removeBlock(type);
            };

            wrapper.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('source', 'workspace');
                e.dataTransfer.setData('type', type);
            });

            if (type === 'hundreds') {
                wrapper.className += ' w-[64px] h-[64px] bg-blue-600 border border-blue-300 rounded shadow';
                wrapper.innerHTML = `
                    <svg viewBox="0 0 100 100" class="w-full h-full pointer-events-none opacity-80">
                        <path d="M 10 0 L 10 100 M 20 0 L 20 100 M 30 0 L 30 100 M 40 0 L 40 100 M 50 0 L 50 100 M 60 0 L 60 100 M 70 0 L 70 100 M 80 0 L 80 100 M 90 0 L 90 100" stroke="#93c5fd" stroke-width="1.5"/>
                        <path d="M 0 10 L 100 10 M 0 20 L 100 20 M 0 30 L 100 30 M 0 40 L 100 40 M 0 50 L 100 50 M 0 60 L 100 60 M 0 70 L 100 70 M 0 80 L 80 80 M 0 90 L 90 90" stroke="#93c5fd" stroke-width="1.5"/>
                    </svg>`;
            } else if (type === 'tens') {
                wrapper.className += ' w-[10px] h-[64px] bg-amber-400 border border-amber-200 rounded shadow-sm';
                wrapper.innerHTML = `
                    <svg viewBox="0 0 10 100" class="w-full h-full pointer-events-none opacity-80">
                        <path d="M 0 10 L 10 10 M 0 20 L 10 20 M 0 30 L 10 30 M 0 40 L 10 40 M 0 50 L 10 50 M 0 60 L 10 60 M 0 70 L 10 70 M 0 80 L 10 80 M 0 90 L 10 90" stroke="#78350f" stroke-width="1.5"/>
                    </svg>`;
            } else if (type === 'ones') {
                wrapper.className += ' w-[12px] h-[12px] bg-white border border-slate-300 rounded-sm shadow-sm';
            }

            return wrapper;
        }

        function handleMenuDragStart(ev, type) {
            ev.dataTransfer.setData('source', 'menu');
            ev.dataTransfer.setData('type', type);
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function handleWorkspaceDrop(ev) {
            ev.preventDefault();
            const source = ev.dataTransfer.getData('source');
            const type = ev.dataTransfer.getData('type');

            if (source === 'menu' && type) {
                addBlock(type);
            }
        }

        function handleDropToConvert(ev) {
            ev.preventDefault();
            const blockType = ev.dataTransfer.getData('type');

            if (blockType === 'hundreds' || blockType === 'tens') {
                convertTopBlock(blockType);
            } else if (blockType === 'ones') {
                setGuidance("【一】是最小單位囉！");
            }
        }

        function generateRandomQuestion() {
            const randomVal = Math.floor(Math.random() * 199) + 1;
            state.targetNumber = randomVal;
            
            document.getElementById('target-display-container').classList.remove('hidden');
            document.getElementById('target-number-text').textContent = randomVal;
            
            const badge = document.getElementById('target-status-badge');
            badge.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-amber-200 text-amber-800';
            badge.textContent = '作答中';

            resetCanvas(false);
            setGuidance(`請擺出【${randomVal}】，好了按「確認繳交」！`);
        }

        function promptCustomQuestion() {
            document.getElementById('custom-num-modal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('custom-num-modal').classList.add('hidden');
        }

        function applyCustomQuestion() {
            const inputVal = parseInt(document.getElementById('custom-num-input').value, 10);
            if (isNaN(inputVal) || inputVal < 1 || inputVal > 1000) {
                setGuidance("請輸入 1 到 1000 的數字！");
                return;
            }

            state.targetNumber = inputVal;
            document.getElementById('target-display-container').classList.remove('hidden');
            document.getElementById('target-number-text').textContent = inputVal;

            const badge = document.getElementById('target-status-badge');
            badge.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-amber-200 text-amber-800';
            badge.textContent = '作答中';

            closeCustomModal();
            resetCanvas(false);
            setGuidance(`題目為【${inputVal}】，好了點選「確認繳交」！`);
        }

        function checkSubmittedAnswer() {
            if (!state.targetNumber) return;

            const currentTotal = getCombinedTotal();
            const badge = document.getElementById('target-status-badge');

            if (currentTotal === state.targetNumber) {
                badge.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-500 text-white animate-bounce';
                badge.textContent = '答對了！';
                setGuidance(`🎉 太棒了！數量完全正確！`);
            } else {
                badge.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-rose-200 text-rose-800';
                badge.textContent = '再試試';
                
                if (currentTotal < state.targetNumber) {
                    setGuidance(`還差一點點！目前是 ${currentTotal}（太少了），再增加一些！`);
                } else {
                    setGuidance(`還差一點點！目前是 ${currentTotal}（太多了），拿掉一些！`);
                }
            }
        }

        function undoState() {
            if (historyStack.length > 0) {
                const previous = historyStack.pop();
                state.hundreds = previous.hundreds;
                state.tens = previous.tens;
                state.ones = previous.ones;
                updateUI();
                setGuidance("已返回上一步。");
            }
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undo-btn');
            if (undoBtn) {
                undoBtn.disabled = historyStack.length === 0;
            }
        }

        function resetCanvas(clearTarget = true) {
            saveSnapshot();
            state.hundreds = 0;
            state.tens = 0;
            state.ones = 0;

            if (clearTarget) {
                state.targetNumber = null;
                document.getElementById('target-display-container').classList.add('hidden');
            }

            updateUI();
            setGuidance("畫面已清空，開始操作吧！");
        }

        function setGuidance(msg) {
            const guidanceText = document.getElementById('guidance-text');
            if (guidanceText) guidanceText.textContent = msg;
        }

        function getUnitName(type) {
            if (type === 'hundreds') return '百';
            if (type === 'tens') return '十';
            if (type === 'ones') return '一';
            return '';
        }

        function updateReflectionPrompt() {
            const promptElem = document.getElementById('reflection-prompt-text');
            if (!promptElem) return;

            if (state.ones >= 10) {
                promptElem.textContent = "「一」滿10個囉！按按鈕合成為「十」吧！";
            } else if (state.tens >= 10) {
                promptElem.textContent = "「十」滿10個囉！按按鈕合成為「百」吧！";
            } else {
                const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
                promptElem.textContent = randomPrompt;
            }
        }

        window.onload = function() {
            updateUI();
            updateUndoButtonState();
        };
    </script>
</body>
</html>
